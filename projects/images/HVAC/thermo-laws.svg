<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
  <defs>
    <style>
      .label  { font: 700 10px/1 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; fill: #888; text-transform: uppercase; }
      .law    { font: 700 18px/1 'Helvetica Neue', Arial, sans-serif; fill: #111; }
      .eq     { font: 300 36px/1 'Georgia', serif; fill: #111; }
      .key    { font: 600 11px/1 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: #444; }
      .desc   { font: 400 12px/1.55 'Helvetica Neue', Arial, sans-serif; fill: #666; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="500" fill="#fff"/>
  <!-- Top rule -->
  <rect width="860" height="3" fill="#111"/>

  <!-- Page title -->
  <text x="430" y="44" text-anchor="middle" class="label" font-size="11" letter-spacing="3">Laws of Thermodynamics</text>

  <!-- ── CARD 1: Zeroth Law ─────────────────────────────────── -->
  <rect x="30" y="68" width="388" height="198" rx="6" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="98"  class="label">Zeroth Law</text>
  <text x="50" y="122" class="law">Thermal Equilibrium</text>
  <text x="50" y="172" class="eq">A≡B, B≡C → A≡C</text>
  <text x="50" y="202" class="key">KEY PRINCIPLE</text>
  <text x="50" y="220" class="desc">If two systems are each in thermal equilibrium</text>
  <text x="50" y="238" class="desc">with a third, they are in equilibrium with each other.</text>

  <!-- ── CARD 2: First Law ──────────────────────────────────── -->
  <rect x="442" y="68" width="388" height="198" rx="6" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1"/>
  <text x="462" y="98"  class="label">First Law</text>
  <text x="462" y="122" class="law">Conservation of Energy</text>
  <text x="462" y="172" class="eq">ΔU = Q − W</text>
  <text x="462" y="202" class="key">KEY PRINCIPLE</text>
  <text x="462" y="220" class="desc">Energy cannot be created or destroyed —</text>
  <text x="462" y="238" class="desc">only converted from one form to another.</text>

  <!-- ── CARD 3: Second Law ─────────────────────────────────── -->
  <rect x="30" y="284" width="388" height="198" rx="6" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="314"  class="label">Second Law</text>
  <text x="50" y="338" class="law">Entropy</text>
  <text x="50" y="388" class="eq">ΔS<tspan baseline-shift="sub" font-size="24">univ</tspan> ≥ 0</text>
  <text x="50" y="418" class="key">KEY PRINCIPLE</text>
  <text x="50" y="436" class="desc">The total entropy of an isolated system always</text>
  <text x="50" y="454" class="desc">increases — heat flows from hot to cold.</text>

  <!-- ── CARD 4: Third Law ──────────────────────────────────── -->
  <rect x="442" y="284" width="388" height="198" rx="6" fill="#f7f7f7" stroke="#e0e0e0" stroke-width="1"/>
  <text x="462" y="314"  class="label">Third Law</text>
  <text x="462" y="338" class="law">Absolute Zero</text>
  <text x="462" y="388" class="eq">S → 0  as  T → 0 K</text>
  <text x="462" y="418" class="key">KEY PRINCIPLE</text>
  <text x="462" y="436" class="desc">The entropy of a perfect crystal approaches zero</text>
  <text x="462" y="454" class="desc">as temperature approaches absolute zero.</text>

  <!-- Bottom rule -->
  <rect y="497" width="860" height="3" fill="#111"/>
</svg>
